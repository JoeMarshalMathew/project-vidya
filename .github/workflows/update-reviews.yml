name: Daily Google Reviews Sync & Deploy

on:
  schedule:
    - cron: '0 2 * * *' # Runs every day at 2:00 AM UTC
  workflow_dispatch: # Allows you to manually trigger it anytime from GitHub UI

permissions:
  contents: write

jobs:
  sync-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Fetch Script
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACES_API_PLACE_ID: ${{ secrets.GOOGLE_PLACES_API_PLACE_ID }}
        run: node scripts/fetch-reviews.js

      - name: Commit and push if reviews changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/reviews.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated daily reviews update [skip ci]" && git push)