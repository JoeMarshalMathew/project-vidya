name: Update Daily Reviews

on:
  schedule:
    - cron: '0 6 * * *' # Runs every day at 6:00 AM UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Fetch and Generate Reviews JSON
        run: node scripts/fetch-reviews.js
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACES_API_PLACE_ID: ${{ secrets.GOOGLE_PLACES_API_PLACE_ID }}

      - name: Build Static Site (Eleventy)
        run: npm run build # Or whatever your build command is in package.json

      - name: Commit and Push updated reviews.json (Optional)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/reviews.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: daily update of reviews.json [skip ci]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site' # Your Eleventy output folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4