<header id="site-header" class="fixed top-0 left-0 w-full z-50 bg-white border-b border-slate-100 shadow-sm transition-all duration-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    
    <!-- Left Section: Circular Logo + Brand Text -->
    <a href="#home" class="flex items-center space-x-2.5 sm:space-x-3 group">
      <!-- Logo Container -->
      <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full overflow-hidden flex items-center justify-center shrink-0 border border-slate-200 bg-slate-50 transition-transform group-hover:scale-105">
        <img 
          src="/assets/logo.png" 
          alt="NiNi's Academy Logo" 
          class="w-full h-full object-cover rounded-full"
          onerror="this.onerror=null; this.src='https://via.placeholder.com/40?text=NA';"
        />
      </div>
      
      <!-- Text Branding -->
      <div class="flex flex-col">
        <span class="font-black text-sm sm:text-lg text-primary leading-tight">
          NiNi's Academy
        </span>
        <span class="text-[9px] sm:text-[10px] font-bold text-primary/80 tracking-wider uppercase">
          Tuition Center
        </span>
      </div>
    </a>

    <!-- Center/Right Section: Desktop Navigation Links & CTA -->
    <div class="flex items-center space-x-4 sm:space-x-8">
      <nav class="hidden md:flex items-center space-x-8">
        <a href="#services" class="text-sm font-bold text-primary hover:opacity-80 transition-opacity">
          Programs
        </a>
        <a href="#location" class="text-sm font-bold text-primary hover:opacity-80 transition-opacity">
          Location
        </a>
        <a href="#about" class="text-sm font-bold text-primary hover:opacity-80 transition-opacity">
          About Us
        </a>
        <a href="#contact" class="text-sm font-bold text-primary hover:opacity-80 transition-opacity">
          Contact Us
        </a>
      </nav>

      <!-- Desktop CTA Button -->
      <a 
        href="#consultation-form" 
        class="hidden sm:inline-block px-5 py-2 rounded-xl bg-highlight text-textDark font-bold text-sm shadow-sm hover:brightness-95 active:scale-95 transition-all whitespace-nowrap">
        Get a Free Consultation
      </a>

      <!-- Mobile Hamburger Menu Button -->
      <button 
        id="menu-btn" 
        type="button" 
        aria-label="Toggle Navigation Menu"
        class="md:hidden p-2 rounded-lg text-primary hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-primary/20">
        <svg id="menu-icon-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <svg id="menu-icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

  </div>

  <!-- Mobile Dropdown Menu Drawer -->
  <div id="mobile-menu" class="hidden md:hidden bg-white border-b border-slate-100 shadow-xl px-6 pt-4 pb-6 space-y-4 absolute top-16 left-0 w-full transition-all">
    <nav class="flex flex-col space-y-3">
      <a href="#services" class="mobile-link text-base font-bold text-primary hover:text-highlight py-1.5 transition-colors">
        Programs
      </a>
      <a href="#location" class="mobile-link text-base font-bold text-primary hover:text-highlight py-1.5 transition-colors">
        Location
      </a>
      <a href="#about" class="mobile-link text-base font-bold text-primary hover:text-highlight py-1.5 transition-colors">
        About Us
      </a>
      <a href="#contact" class="mobile-link text-base font-bold text-primary hover:text-highlight py-1.5 transition-colors">
        Contact Us
      </a>
    </nav>
    <div class="pt-2 border-t border-slate-100">
      <a 
        href="#consultation-form" 
        class="mobile-link block text-center w-full px-4 py-2.5 rounded-xl bg-highlight text-textDark font-bold text-sm shadow-sm hover:brightness-95 transition-all">
        Get a Free Consultation
      </a>
    </div>
  </div>
</header>

<!-- Mobile Menu Toggle Script -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const iconOpen = document.getElementById('menu-icon-open');
    const iconClose = document.getElementById('menu-icon-close');
    const mobileLinks = document.querySelectorAll('.mobile-link');

    if (menuBtn && mobileMenu) {
      function toggleMenu() {
        mobileMenu.classList.toggle('hidden');
        iconOpen.classList.toggle('hidden');
        iconClose.classList.toggle('hidden');
      }

      menuBtn.addEventListener('click', toggleMenu);

      // Automatically close menu when a navigation item is tapped
      mobileLinks.forEach(link => {
        link.addEventListener('click', () => {
          mobileMenu.classList.add('hidden');
          iconOpen.classList.remove('hidden');
          iconClose.classList.add('hidden');
        });
      });
    }
  });
</script>
