<header id="site-header" class="fixed top-0 left-0 w-full z-50 transition-all duration-300 bg-white border-b border-amber-100 shadow-sm">
  <div class="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
    
    <!-- Left Section: Logo Asset -->
    <a href="#home" class="flex items-center">
      <div class="bg-white p-2 rounded-lg shadow-sm">
        <img src="/assets/logo.png" alt="NiNi's Academy Logo" class="h-12 w-auto object-contain">
      </div>
    </a>

    <!-- Right Section: Navigation Links -->
    <nav class="hidden md:flex space-x-8">
      <a href="#home" class="nav-link text-sm font-bold text-[{{ theme.colors.primary }}] hover:text-[{{ theme.colors.secondary }}] transition-colors">Home</a>
      <a href="#services" class="nav-link text-sm font-bold text-[{{ theme.colors.primary }}] hover:text-[{{ theme.colors.secondary }}] transition-colors">Services</a>
      <a href="#location" class="nav-link text-sm font-bold text-[{{ theme.colors.primary }}] hover:text-[{{ theme.colors.secondary }}] transition-colors">Location</a>
      <a href="#about" class="nav-link text-sm font-bold text-[{{ theme.colors.primary }}] hover:text-[{{ theme.colors.secondary }}] transition-colors">About Us</a>
      <a href="#contact" class="nav-link text-sm font-bold text-[{{ theme.colors.primary }}] hover:text-[{{ theme.colors.secondary }}] transition-colors">Contacts</a>
    </nav>
    
  </div>
</header>

<script>
  // Listen for window scrolling to toggle the header's background state
  window.addEventListener('scroll', function() {
    const header = document.getElementById('site-header');
    const links = document.querySelectorAll('.nav-link');
    
    if (window.scrollY > 20) {
      // Scrolled down: Apply the darker background and turn text white
      header.style.backgroundColor = "{{ theme.colors.navBgActive }}";
      header.style.borderColor = "rgba(255, 255, 255, 0.1)";
      links.forEach(link => link.style.color = "#ffffff");
    } else {
      // At the top: Revert to the clean light background and primary text
      header.style.backgroundColor = "#ffffff";
      header.style.borderColor = "";
      links.forEach(link => link.style.color = "{{ theme.colors.primary }}");
    }
  });
</script>
