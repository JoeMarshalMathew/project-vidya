<section id="reviews" class="scroll-mt-20 py-6 sm:py-8 bg-bgWarmLight px-6">
  <div class="max-w-6xl mx-auto">
    
    <!-- Section Header -->
    <div class="flex flex-col md:flex-row md:items-end justify-between mb-6 sm:mb-8 border-b border-slate-200/80 pb-4">
      <div>
        <h2 class="text-3xl font-black text-textDark">Google Reviews</h2>
        <p class="text-slate-600 mt-2">See what our students and parents say about us</p>
      </div>
      <!-- Action Link using custom primary color utility -->
      <a 
        href="https://www.google.com/maps/place/?q=place_id:ChIJrekd-z0d1moRNbJQBGg0GNE" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="mt-4 md:mt-0 text-xs font-bold uppercase tracking-wider text-primary hover:opacity-80 transition-opacity">
        View All Reviews &rarr;
        </a>
    </div>
    
    <!-- Reviews Container -->
    <div class="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-100">
      
      <!-- Aggregated Header Stats -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-6 border-b border-slate-100">
        <div>
          <h3 class="font-bold text-lg text-slate-900">Overall Rating</h3>
          <p class="text-xs text-slate-500 mt-0.5" id="total-reviews-text">Loading reviews data...</p>
        </div>
        <div class="flex items-center gap-2">
          <span id="avg-rating" class="text-3xl font-black text-primary">5.0</span>
          <div class="text-yellow-500 text-lg tracking-tighter">★★★★★</div>
        </div>
      </div>

      <!-- Carousel Wrapper -->
      <div class="relative overflow-hidden">
        
        <!-- Slides Track (Populated Dynamically) -->
        <div id="review-carousel-track" class="flex transition-transform duration-500 ease-in-out">
          <div class="w-full flex-shrink-0 px-1 text-center py-8 text-slate-400 text-sm">Loading reviews...</div>
        </div>

        <!-- Carousel Navigation Controls -->
        <div class="flex items-center justify-between mt-6">
          <button onclick="prevReviewSlide()" class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors focus:outline-none flex items-center gap-1 text-xs font-bold uppercase tracking-wider">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> Prev
          </button>
          
          <!-- Dots Indicator (Populated Dynamically) -->
          <div class="flex gap-2" id="carousel-dots"></div>

          <button onclick="nextReviewSlide()" class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors focus:outline-none flex items-center gap-1 text-xs font-bold uppercase tracking-wider">
            Next <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </button>
        </div>

      </div>

    </div>

  </div>
</section>

<!-- Carousel Interaction & Stats Fetch Script -->
<script>
  let currentReviewSlide = 0;
  let totalReviewSlides = 0;
  let autoPlayInterval = null;

  async function loadReviewData() {
    try {
      const response = await fetch('public/reviews.json');
      const data = await response.json();

      // 1. Update header rating stats
      if (data.averageRating) {
        document.getElementById('avg-rating').textContent = Number(data.averageRating).toFixed(1);
      }
      if (data.totalReviews) {
        document.getElementById('total-reviews-text').textContent = `Based on ${data.totalReviews} verified Google reviews`;
      }

      // 2. Populate Carousel Slides dynamically if reviews array exists
      if (data.topReviews && Array.isArray(data.topReviews) && data.topReviews.length > 0) {
        totalReviewSlides = data.topReviews.length;
        const track = document.getElementById('review-carousel-track');
        const dotsContainer = document.getElementById('carousel-dots');
        
        track.innerHTML = '';
        dotsContainer.innerHTML = '';

        data.topReviews.forEach((review, index) => {
          // Build slide HTML
          const slideDiv = document.createElement('div');
          slideDiv.className = 'w-full flex-shrink-0 px-1';
          slideDiv.innerHTML = `
            <div class="bg-slate-50 p-6 rounded-xl border border-slate-100 h-full flex flex-col justify-between">
              <div class="flex items-center justify-between mb-3">
                <span class="font-bold text-sm text-slate-900">${review.author_name || 'Anonymous'}</span>
                <span class="text-yellow-500 text-xs tracking-tighter">${'★'.repeat(review.rating || 5)}</span>
              </div>
              <p class="text-sm text-slate-600 italic leading-relaxed">"${review.text || ''}"</p>
            </div>
          `;
          track.appendChild(slideDiv);

          // Build dot indicator HTML
          const dotBtn = document.createElement('button');
          dotBtn.onclick = () => goToSlide(index);
          dotBtn.className = `w-2.5 h-2.5 rounded-full transition-all ${index === 0 ? 'bg-primary' : 'bg-slate-300'}`;
          dotsContainer.appendChild(dotBtn);
        });

        startAutoPlay();
      }
    } catch (error) {
      console.error("Failed to load reviews.json data:", error);
      document.getElementById('total-reviews-text').textContent = "Based on 13 verified Google reviews";
    }
  }

  function updateCarousel() {
    if (totalReviewSlides === 0) return;
    const track = document.getElementById('review-carousel-track');
    track.style.transform = `translateX(-${currentReviewSlide * 100}%)`;

    // Update dots styling
    const dots = document.getElementById('carousel-dots').children;
    for (let i = 0; i < dots.length; i++) {
      if (i === currentReviewSlide) {
        dots[i].classList.remove('bg-slate-300');
        dots[i].classList.add('bg-primary');
      } else {
        dots[i].classList.remove('bg-primary');
        dots[i].classList.add('bg-slate-300');
      }
    }
  }

  function nextReviewSlide() {
    if (totalReviewSlides === 0) return;
    currentReviewSlide = (currentReviewSlide + 1) % totalReviewSlides;
    updateCarousel();
    resetAutoPlay();
  }

  function prevReviewSlide() {
    if (totalReviewSlides === 0) return;
    currentReviewSlide = (currentReviewSlide - 1 + totalReviewSlides) % totalReviewSlides;
    updateCarousel();
    resetAutoPlay();
  }

  function goToSlide(index) {
    if (totalReviewSlides === 0) return;
    currentReviewSlide = index;
    updateCarousel();
    resetAutoPlay();
  }

  function startAutoPlay() {
    if (autoPlayInterval) clearInterval(autoPlayInterval);
    autoPlayInterval = setInterval(() => {
      if (totalReviewSlides > 0) {
        currentReviewSlide = (currentReviewSlide + 1) % totalReviewSlides;
        updateCarousel();
      }
    }, 6000);
  }

  function resetAutoPlay() {
    clearInterval(autoPlayInterval);
    startAutoPlay();
  }

  // Initialize fetch on DOM load
  document.addEventListener("DOMContentLoaded", () => {
    loadReviewData();
  });
</script>
