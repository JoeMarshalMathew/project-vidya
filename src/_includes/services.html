<script>
  // Central dictionary containing all localized text and Unsplash copyright-free image URLs
  const translations = {
    en: {
      header: {
        title: "Our Programs",
        subtitle: "Structured, curriculum-aligned academic support from Prep to Year 12",
        cta: "Enquire Now →"
      },
      programs: [
        {
          image: "https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=800&q=80",
          title: "Primary School Tutoring",
          subtitle: "Supporting students from Year 1–6 to build strong literacy and numeracy foundations.",
          ctaText: "Enquire Now"
        },
        {
          image: "https://images.unsplash.com/photo-1427504494785-3a9ca7044f45?auto=format&fit=crop&w=800&q=80",
          title: "Junior High Support",
          subtitle: "Targeted guidance through Year 7–10 mathematics, science, and study habits.",
          ctaText: "Enquire Now"
        },
        {
          image: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=800&q=80",
          title: "Senior Secondary Mastery",
          subtitle: "Advanced subject-specific tutoring and exam strategies for Year 11 and 12 success.",
          ctaText: "Enquire Now"
        },
        {
          image: "https://images.unsplash.com/photo-1434030216411-0b793f4b4173?auto=format&fit=crop&w=800&q=80",
          title: "Targeted Prep",
          subtitle: "Specialized drills and practice for NAPLAN, selective entry, and scholarship exams.",
          ctaText: "Enquire Now"
        }
      ]
    }
  };

  document.addEventListener('DOMContentLoaded', () => {
    const lang = translations.en;

    // 1. Populate header text elements safely from the dictionary
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const keys = el.getAttribute('data-i18n').split('.');
      let val = lang;
      keys.forEach(k => val = val ? val[k] : null);
      if (val) el.innerHTML = val;
    });

    // 2. Populate card content dynamically into the static HTML wrappers
    document.querySelectorAll('[data-program-index]').forEach(cardEl => {
      const index = cardEl.getAttribute('data-program-index');
      const data = lang.programs[index];
      if (!data) return;

      const imgEl = cardEl.querySelector('.card-img');
      const titleEl = cardEl.querySelector('.card-title');
      const subtitleEl = cardEl.querySelector('.card-subtitle');
      const ctaEl = cardEl.querySelector('.card-cta');

      if (imgEl) {
        imgEl.src = data.image;
        imgEl.alt = data.title;
      }
      if (titleEl) titleEl.textContent = data.title;
      if (subtitleEl) subtitleEl.textContent = data.subtitle;
      if (ctaEl) ctaEl.textContent = data.ctaText;
    });

    // 3. Slider Navigation & Auto-Rotation Logic
    const slider = document.getElementById('programs-slider');
    const prevBtn = document.getElementById('slider-prev');
    const nextBtn = document.getElementById('slider-next');

    if (slider && prevBtn && nextBtn) {
      const cards = slider.querySelectorAll(':scope > div');

      const scrollNext = () => {
        if (window.innerWidth >= 768) return; // Mobile view only

        const cardWidth = cards[0].clientWidth + 24;
        const maxScrollLeft = slider.scrollWidth - slider.clientWidth;

        if (slider.scrollLeft >= maxScrollLeft - 10) {
          slider.scrollTo({ left: 0, behavior: 'smooth' });
        } else {
          slider.scrollBy({ left: cardWidth, behavior: 'smooth' });
        }
      };

      prevBtn.addEventListener('click', () => {
        const cardWidth = cards[0].clientWidth + 24;
        slider.scrollBy({ left: -cardWidth, behavior: 'smooth' });
      });

      nextBtn.addEventListener('click', () => {
        const cardWidth = cards[0].clientWidth + 24;
        slider.scrollBy({ left: cardWidth, behavior: 'smooth' });
      });

      // Auto-rotate every 4 seconds on mobile
      let autoScrollTimer = setInterval(scrollNext, 4000);

      // Pause auto-rotation on user interaction
      ['touchstart', 'mouseenter', 'click'].forEach(eventType => {
        slider.addEventListener(eventType, () => {
          clearInterval(autoScrollTimer);
        }, { passive: true });
      });
    }
  });
</script>
