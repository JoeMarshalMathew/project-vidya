<header id="site-header" class="fixed top-0 left-0 w-full z-50 transition-all duration-300 bg-white border-b border-slate-100 shadow-sm">
  <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
    
    <!-- Left Section: Clean Logo + Brand Text -->
    <a href="#home" class="flex items-center space-x-3 group py-1">
      <div class="w-14 h-14 rounded-full overflow-hidden flex items-center justify-center p-0.5 transition-transform group-hover:scale-105 shrink-0">
        <img src="assets/logo.png" alt="NiNi's Academy" class="w-full h-full object-cover rounded-full">
      </div>
      <div class="flex flex-col">
        <span id="brand-title" class="font-extrabold text-lg text-blue-950 leading-tight transition-colors">
          NiNi's Academy
        </span>
        <span id="brand-subtitle" class="text-[10px] font-bold text-blue-950 tracking-wider uppercase transition-colors">
          Tuition Center
        </span>
      </div>
    </a>

    <!-- Right Section: Navigation Links (Teal Text at Top) -->
    <nav class="hidden md:flex space-x-8">
      <a href="#home" class="nav-link text-sm font-bold text-blue-950 hover:text-teal-800 transition-colors">Home</a>
      <a href="#services" class="nav-link text-sm font-bold text-blue-950 hover:text-teal-800 transition-colors">Services</a>
      <a href="#location" class="nav-link text-sm font-bold text-blue-950 hover:text-teal-800 transition-colors">Location</a>
      <a href="#about" class="nav-link text-sm font-bold text-blue-950 hover:text-teal-800 transition-colors">About Us</a>
      <a href="#contact" class="nav-link text-sm font-bold text-blue-950 hover:text-teal-800 transition-colors">Contacts</a>
    </nav>
    
  </div>
</header>

<script>
  window.addEventListener('scroll', function() {
    const header = document.getElementById('site-header');
    const brandTitle = document.getElementById('brand-title');
    const brandSubtitle = document.getElementById('brand-subtitle');
    const links = document.querySelectorAll('.nav-link');
    
    const tealColor = "#0d9488"; // Teal Color

    if (window.scrollY > 20) {
      // SCROLLED STATE: Teal Header + White Text for Everything
      header.style.backgroundColor = tealColor;
      header.style.borderColor = "rgba(255, 255, 255, 0.15)";
      brandTitle.style.color = "#ffffff";
      brandSubtitle.style.color = "#ffffff";
      links.forEach(link => link.style.color = "#ffffff");
    } else {
      // TOP MOST STATE: White Header + Teal Text for Everything
      header.style.backgroundColor = "#ffffff";
      header.style.borderColor = "";
      brandTitle.style.color = tealColor;
      brandSubtitle.style.color = tealColor;
      links.forEach(link => link.style.color = tealColor);
    }
  });
</script>
