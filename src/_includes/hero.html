<!-- Entrance Animation & Cross-Fade Slideshow Styles/Script -->
<style>
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .animate-fade-in-up {
    animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
</style>

<script>
  const sliderImages = [
    "assets/media/ad_1.jpg",
    "assets/media/ad_2.jpg",
    "assets/media/ad_3.jpg",
    "assets/media/ad_4.jpg",
    "assets/media/ad_5.jpg",
    "assets/media/ad_6.jpg",
    "assets/media/ad_7.jpg",
    "assets/media/ad_8.jpg"
  ];

  document.addEventListener('DOMContentLoaded', () => {
    const img1 = document.getElementById('hero-img-1');
    const img2 = document.getElementById('hero-img-2');
    if (!img1 || !img2) return;

    let currentIndex = 0;
    let showingFirst = true;

    setInterval(() => {
      currentIndex = (currentIndex + 1) % sliderImages.length;
      const nextImageSrc = sliderImages[currentIndex];

      if (showingFirst) {
        img2.src = nextImageSrc;
        img2.style.opacity = '1';
        img1.style.opacity = '0';
      } else {
        img1.src = nextImageSrc;
        img1.style.opacity = '1';
        img2.style.opacity = '0';
      }

      showingFirst = !showingFirst;
    }, 3000);
  });
</script>
