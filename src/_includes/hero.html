<!-- Hero Section with Smooth Cross-Fade Slideshow -->
<section class="max-w-7xl mx-auto px-4 sm:px-6 pt-24 pb-12 flex flex-col lg:flex-row items-center gap-6">
  
  <!-- Left Text Card -->
  <div class="w-full lg:w-[58%] bg-[#0B192C] text-white rounded-3xl p-8 sm:p-12 flex flex-col justify-between shadow-xl min-h-[420px]">
    <div class="space-y-4">
      <span class="text-xs font-bold tracking-widest uppercase text-slate-300">Welcome to NiNi's Academy</span>
      <h1 class="text-3xl sm:text-5xl font-black tracking-tight leading-tight">
        Empowering Students to Reach Their Full Potential
      </h1>
      <p class="text-slate-300 text-sm sm:text-base leading-relaxed">
        Personalized tuition programs tailored to build confidence, master core concepts, and achieve academic excellence.
      </p>
    </div>
    <div class="pt-6">
      <a href="#consultation-form" class="inline-block px-8 py-3.5 rounded-xl bg-highlight text-textDark font-bold text-sm shadow-md hover:brightness-105 active:scale-95 transition-all">
        Get Started
      </a>
    </div>
  </div>

  <!-- Right Image Slideshow Container -->
  <div class="relative w-full lg:w-[42%] h-[420px] rounded-3xl overflow-hidden shadow-xl bg-white border border-slate-100">
    
    <!-- Image Layer A -->
    <img id="hero-img-1" src="/assets/media/ad_1.jpg" alt="Academy slideshow" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out opacity-100">

    <!-- Image Layer B -->
    <img id="hero-img-2" src="/assets/media/ad_2.jpg" alt="Academy slideshow" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out opacity-0">

  </div>

</section>

<!-- Smooth Cross-Fade Slideshow Script -->
<script>
  const sliderImages = [
    "/assets/media/ad_1.jpg",
    "/assets/media/ad_2.jpg",
    "/assets/media/ad_3.jpg",
    "/assets/media/ad_4.jpg",
    "/assets/media/ad_5.jpg",
    "/assets/media/ad_6.jpg",
    "/assets/media/ad_7.jpg",
    "/assets/media/ad_8.jpg"
  ];

  document.addEventListener('DOMContentLoaded', () => {
    const img1 = document.getElementById('hero-img-1');
    const img2 = document.getElementById('hero-img-2');
    if (!img1 || !img2) return;

    let currentIndex = 0;
    let showingFirst = true;

    setInterval(() => {
      currentIndex = (currentIndex + 1) % sliderImages.length;
      const nextImageSrc = sliderImages[currentIndex];

      if (showingFirst) {
        // Load next image into layer B, then cross-fade
        img2.src = nextImageSrc;
        img2.style.opacity = '1';
        img1.style.opacity = '0';
      } else {
        // Load next image into layer A, then cross-fade
        img1.src = nextImageSrc;
        img1.style.opacity = '1';
        img2.style.opacity = '0';
      }

      showingFirst = !showingFirst;
    }, 3000); // Changes every 3 seconds smoothly without flickering
  });
</script>
