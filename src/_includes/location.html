<section id="location" class="scroll-mt-20 py-6 sm:py-8 bg-bgWarmLight px-6">
  <div class="max-w-6xl mx-auto">
    
    <!-- Section Header -->
    <div class="flex flex-col md:flex-row md:items-end justify-between mb-6 sm:mb-8 border-b border-slate-200/80 pb-4">
      <div>
        <h2 class="text-3xl font-black text-textDark">Our Location</h2>
        <p class="text-slate-600 mt-2">Find our training facilities and campus details</p>
      </div>
      <a 
        href="https://www.google.com/maps/place/?q=place_id:ChIJrekd-z0d1moRNbJQBGg0GNE" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="mt-4 md:mt-0 text-xs font-bold uppercase tracking-wider text-primary hover:opacity-80 transition-opacity relative z-30">
        Open in Maps &rarr;
      </a>
    </div>
    
    <!-- Interactive Map & Custom Marker Container -->
    <div class="relative bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-sm">
      <div class="w-full h-96 sm:h-[450px] relative">
        <iframe 
          title="NiNi's Academy Location Map"
          src="https://www.google.com/maps?q=-38.0772,145.4851&z=17&output=embed" 
          width="100%" 
          height="100%" 
          style="border:0;" 
          allowfullscreen="" 
          loading="lazy" 
          referrerpolicy="no-referrer-when-downgrade"
          class="w-full h-full grayscale-[20%] contrast-[105%]"
        ></iframe>

        <!-- Transparent Shield Layer -->
        <div class="absolute inset-0 z-10 bg-transparent pointer-events-auto cursor-default" id="mapShield"></div>

        <!-- Custom Persistent Red Pin & Toggleable Card (Google Maps Pop-up Style) -->
        <div class="absolute inset-0 pointer-events-none flex items-center justify-center z-20">
          <div class="relative pointer-events-auto cursor-pointer group flex flex-col items-center" id="mapPinToggle">
            
            <!-- Clean Google-style Floating Card with "View on Google Maps" button -->
            <div id="mapAddressCard" class="hidden mb-3 bg-white text-slate-800 p-4 rounded-lg shadow-2xl border border-slate-100 min-w-[240px] transition-all animate-fade-in relative z-30 select-none">
              <div class="font-bold text-sm text-slate-900 mb-0.5">NiNi's Academy</div>
              <div class="text-xs text-slate-600 mb-3">21 Stable Street, Pakenham 3810<br>Victoria, Australia</div>
              
              <!-- Google Maps Style "View on Google Maps" Action Button -->
              <a 
                href="https://www.google.com/maps/place/?q=place_id:ChIJrekd-z0d1moRNbJQBGg0GNE" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="block w-full text-center bg-white hover:bg-slate-50 text-blue-600 border border-slate-200 font-semibold text-xs py-2 px-3 rounded shadow-sm transition-colors">
                View on Google Maps
              </a>

              <!-- Tooltip Arrow -->
              <div class="absolute left-1/2 -bottom-2 -translate-x-1/2 w-3.5 h-3.5 bg-white border-r border-b border-slate-200 rotate-45 shadow-sm"></div>
            </div>

            <!-- Always Visible Red Pointer Pin -->
            <div class="w-10 h-10 rounded-full bg-red-600 text-white flex items-center justify-center shadow-lg transform group-hover:scale-110 transition-transform animate-bounce">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </div>
            
            <!-- Pulse ring effect under pin -->
            <span class="absolute -bottom-1 w-4 h-1.5 bg-black/30 rounded-full blur-[1px]"></span>
          </div>
        </div>

      </div>
    </div>

  </div>
</section>

<!-- Script to handle clicking the pointer and toggling the pop-up card -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const pinToggle = document.getElementById('mapPinToggle');
    const addressCard = document.getElementById('mapAddressCard');
    const shield = document.getElementById('mapShield');

    if (pinToggle && addressCard) {
      pinToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        addressCard.classList.toggle('hidden');
      });

      if (shield) {
        shield.addEventListener('click', () => {
          addressCard.classList.add('hidden');
        });
      }

      document.addEventListener('click', (e) => {
        if (!pinToggle.contains(e.target)) {
          addressCard.classList.add('hidden');
        }
      });
    }
  });
</script>
